# Copiá este archivo a wrangler.toml y completá tus propios IDs.
# wrangler.toml está en .gitignore: nunca se publica con claves reales.

name = "asn"
main = "worker/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = true

[[r2_buckets]]
binding = "NOWCAST"
bucket_name = "asn-nowcast"

[[kv_namespaces]]
binding = "SUBS"
id = "TU_KV_NAMESPACE_ID"

[triggers]
crons = ["*/10 * * * *"]

[vars]
VAPID_PUBLIC = "TU_CLAVE_PUBLICA_VAPID"

# Secretos (no van en este archivo):
#   npx wrangler secret put OWNER_KEY
#   npx wrangler secret put VAPID_PRIVATE
#   npx wrangler secret put VAPID_SUBJECT
