name: alerta-meteo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerta-meteo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar pronóstico
        run: node alert.mjs
        env:
          PLACES: ${{ secrets.PLACES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_LEVEL: '2'
          QUIET_HOURS: '23-7'
