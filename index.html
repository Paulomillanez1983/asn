<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alerta Meteo Córdoba</title>
<meta name="description" content="Avisos de lluvia, ráfagas y granizo para tus lugares, con 4 modelos meteorológicos.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alerta Meteo">
<style>
:root{--bg:#0b1220;--card:#151f36;--card2:#1b2742;--txt:#e8eefc;--dim:#93a4c4;--acc:#4f8cff;--ok:#2ecc71;--warn:#f1c40f;--alert:#e67e22;--bad:#e74c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:14px 14px calc(28px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;min-height:100vh}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
header .sub{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:2px}
button{font:inherit;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:9px 13px;cursor:pointer}
button.ghost{background:#22304f}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
button.icon{background:#22304f;padding:9px 11px;font-size:16px;line-height:1}
h2{font-size:15px;margin:22px 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;border-left:6px solid #2b3a58}
.card.l0{border-left-color:var(--ok)}
.card.l1{border-left-color:var(--warn)}
.card.l2{border-left-color:var(--alert)}
.card.l3{border-left-color:var(--bad)}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .name{font-weight:700;font-size:17px;flex:1}
.card .lvl{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#0e1729;color:var(--dim);white-space:nowrap}
.card.l0 .lvl{color:var(--ok)}.card.l1 .lvl{color:var(--warn)}.card.l2 .lvl{color:var(--alert)}.card.l3 .lvl{color:var(--bad)}
.card .what{margin:8px 0 2px;font-size:15px}
.card .what b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{font-size:12px;background:#0e1729;color:var(--dim);border-radius:999px;padding:3px 9px}
.chip.on{background:#2a1d10;color:#ffb86b}
.dots{display:flex;gap:10px;margin:10px 0 0;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.dots span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#3a4a6b;display:inline-block}
.dot.l0{background:var(--ok)}.dot.l1{background:var(--warn)}.dot.l2{background:var(--alert)}.dot.l3{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:12px}
.bar{flex:1;background:#243252;border-radius:3px 3px 0 0;min-height:3px;position:relative}
.bar.s{background:var(--acc)}
.barmeta{display:flex;gap:3px;margin-top:4px;font-size:10px;color:var(--dim)}
.barmeta div{flex:1;text-align:center;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:var(--dim);gap:8px;flex-wrap:wrap}
a{color:#8ab4ff}
.empty{background:var(--card);border-radius:14px;padding:20px;text-align:center;color:var(--dim);font-size:14px}
input,textarea{font:inherit;width:100%;background:#0e1729;border:1px solid #263352;color:var(--txt);border-radius:10px;padding:11px}
input:focus,textarea:focus{outline:2px solid #2f5aa8;border-color:transparent}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.res{background:var(--card2);border-radius:10px;padding:11px 12px;margin-top:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.res:hover{background:#22304f}
.res small{color:var(--dim);font-size:12px}
.pill{font-size:11px;color:var(--dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#22304f;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 6px 20px #0007}
.toast.on{opacity:1}
.obs{display:flex;align-items:center;gap:8px;background:#101b2f;border:1px solid #1e2c47;border-radius:12px;padding:9px 12px;margin:0 0 12px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.obs b{color:var(--txt);font-weight:600}
.obs .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#1b2742;color:var(--dim)}
.obs.warn{border-color:#6b4a12}.obs.bad{border-color:#6b1a1a}
.foot{text-align:center;font-size:11px;color:#5d6f92;margin-top:26px;line-height:1.6}
.hint{font-size:12px;color:var(--dim);margin:6px 0 0}
</style>
</head>
<body>
<header>
  <h1 id="title">⛈️ Alerta Meteo<span class="sub" id="sub">Cargando…</span></h1>
  <button class="icon" id="refresh" title="Actualizar">⟳</button>
  <button class="icon" id="gear" title="Ajustes">⚙️</button>
</header>
<main id="view"></main>
<div class="foot">
  Datos: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 4 modelos ·
  se actualiza cada 5 minutos
</div>
<div class="toast" id="toast"></div>
<script src="app.js" defer></script>
</body>
</html>
