<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#f3f7ff;
    background:radial-gradient(760px 560px at 82% -10%,var(--glow) 0%,transparent 62%),linear-gradient(160deg,#0b1526,#070d18 72%)}
  .veil{position:absolute;inset:0;background:linear-gradient(160deg,rgba(10,20,36,.55),rgba(7,13,24,.88));backdrop-filter:blur(0px)}
  .wrap{position:relative;height:100%;display:flex;align-items:center;gap:58px;padding:64px 72px}
  .icon{width:190px;height:190px;border-radius:46px;flex:none;box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.10)}
  .txt{flex:1;min-width:0}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:22px;color:#c6d4ec;letter-spacing:.4px}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
  h1{font-size:88px;font-weight:800;letter-spacing:-3.5px;line-height:1;margin-top:14px;color:var(--accent)}
  .what{font-size:40px;font-weight:650;margin-top:12px;letter-spacing:-.8px;color:#eaf2ff}
  .tag{font-size:24px;color:#9fb2d1;margin-top:16px}
  .brand{position:absolute;left:72px;bottom:44px;display:flex;align-items:center;gap:12px;font-size:22px;color:#b9c9e6}
  .brand b{font-weight:800;letter-spacing:-.4px}
  .brand span{color:#7d90b3;font-size:17px}
  .url{position:absolute;right:72px;bottom:48px;font-size:19px;color:#6f83a6}
  .emoji{position:absolute;right:80px;top:70px;font-size:150px;line-height:1;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
</style>
</head>
<body>
  <div class="veil"></div>
  <div class="wrap">
    <img class="icon" src="icon-512.png" alt="">
    <div class="txt">
      <div class="eyebrow"><i class="dot"></i><span id="eyebrow">ALERTA</span></div>
      <h1 id="title">Alerta naranja</h1>
      <div class="what" id="what">Se viene lluvia fuerte</div>
      <div class="tag">Avisos en tiempo real · sin instalar nada</div>
    </div>
  </div>
  <div class="emoji" id="emoji">🌧️</div>
  <div class="brand"><b>ASN 4.0</b><span>Alerta Super Niño</span></div>
  <div class="url">asn.asn-clima.workers.dev</div>
<script>
  const P = new URLSearchParams(location.search);
  const lvl = Math.max(0, Math.min(4, Number(P.get('lvl') || 0)));
  const M = [
    { c:'#34d399', t:'Sin alerta', s:'Todo tranquilo', e:'😌', k:'SIN ALERTA' },
    { c:'#fbbf24', t:'Alerta amarilla', s:'Atención: puede pasar algo', e:'🌤️', k:'ALERTA AMARILLA' },
    { c:'#fb923c', t:'Alerta naranja', s:'Se viene lluvia fuerte', e:'🌧️', k:'ALERTA NARANJA' },
    { c:'#f87171', t:'Alerta roja', s:'Quedate adentro', e:'⛈️', k:'ALERTA ROJA' },
    { c:'#c084fc', t:'Alerta morada', s:'Fenómeno excepcional', e:'🌀', k:'ALERTA MORADA' }
  ][lvl];
  document.documentElement.style.setProperty('--accent', M.c);
  document.documentElement.style.setProperty('--glow', M.c + '55');
  document.getElementById('title').textContent = M.t;
  document.getElementById('what').textContent = M.s;
  document.getElementById('emoji').textContent = M.e;
  document.getElementById('eyebrow').textContent = M.k;
</script>
</body>
</html>
